[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deadends"
version = "0.1.0"
description = "A local ledger of failed approaches, so AI-assisted coding stops repeating them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
deadends = "deadends.cli:main"

[tool.setuptools.packages.find]
include = ["deadends*"]
